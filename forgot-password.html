<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RentGo | Forgot Password</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/custom.css">
</head>

<body class="rg-theme rg-customer rg-recovery public-page">

    <div class="public-frame">

    <div
        class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-8 shadow-sm">

        <div class="text-center mb-8">

            <div
                class="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl mx-auto flex items-center justify-center">

                <i class="fa-solid fa-key"></i>

            </div>

            <h1 class="text-2xl font-bold text-slate-900 mt-5">
                Forgot Password?
            </h1>

            <p class="text-sm text-slate-500 mt-2">
                Enter your RentGo customer email to create a new password.
            </p>

        </div>


        <div
            id="forgotMessage"
            class="hidden rounded-xl px-4 py-3 text-sm mb-5">
        </div>


        <form id="forgotPasswordForm">

            <div class="mb-6">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    id="forgotEmail"
                    class="form-input"
                    placeholder="your@email.com"
                    required>

            </div>


            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-semibold">

                Continue

            </button>

        </form>


        <div class="text-center mt-6">

            <a
                href="login.html"
                class="text-sm font-semibold text-blue-600">

                Back to Sign in

            </a>

        </div>

    </div>


    <script src="js/config/store.js"></script>
<script
        src="js/forgot-password.js">
    </script>

    </div>

</body>

</html>
